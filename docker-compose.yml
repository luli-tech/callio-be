services:
  mongodb:
    image: mongo:7
    container_name: callio-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: callio
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: callio-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: callio-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  jasmin:
    image: jookies/jasmin:0.11.0
    container_name: callio-jasmin
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      REDIS_CLIENT_HOST: redis
      AMQP_BROKER_HOST: rabbitmq
    ports:
      - "1401:1401" # HTTP API
      - "2775:2775" # SMPP server
      - "8990:8990" # jCli management console
    volumes:
      - jasmin_config:/etc/jasmin
      - jasmin_logs:/var/log/jasmin

volumes:
  mongodb_data:
  redis_data:
  jasmin_config:
  jasmin_logs:
